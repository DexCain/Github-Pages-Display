<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot123 Lab Website</title>
</head>

<style>

    html, body{
        margin:0px;
        height:100%;
    }

    #screen{
        position: relative;
        background-color: green;
        min-height: 100%;
        width: 100%;
    }

    #scan, #bezel{
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
    }

    #scan{
        opacity: 60%;
        background-repeat: repeat-y;
    }

    .noselect {
  -webkit-touch-callout: none; /* iOS Safari */
    -webkit-user-select: none; /* Safari */
     -khtml-user-select: none; /* Konqueror HTML */
       -moz-user-select: none; /* Old versions of Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
            user-select: none; /* Non-prefixed version, currently
                                  supported by Chrome, Edge, Opera and Firefox */
}

.typing-container {
      display: flex;
      justify-content: center;
      align-items: center;
}



    #content{
        font-family: VT323;
        padding: 100px;
        color: rgb(160,250,25);
        font-size: 30px;
        text-shadow: 1px 1px 2px rgb(150,167,124), 0 0 1em rgb(150,167,124), 0 0 0.2em rgb(150,167,124);
        letter-spacing: 2px;
    }


    button{
        background-color: black;
        border: none;
        color: rgb(160,250,25);
        font-size: 30px;
        text-shadow: 1px 1px 2px rgb(150,167,124), 0 0 1em rgb(150,167,124), 0 0 0.2em rgb(150,167,124);
        padding: 5px 10px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        opacity: 0.6;
    }

    button:hover{
        background-color: rgb(160,250,25);
        color: black;
        text-shadow: 1px 1px 2px rgb(150,167,124), 0 0 1em rgb(150,167,124), 0 0 0.2em rgb(150,167,124);
        animation: none;
    }

    #CurPageHeader{
        margin: 0;
        padding: 0;
        text-align: center;
    }

</style>

<body>
    <div id="screen">
        <img src="scanlines.png" id="scan" class="noselect">
        <img src="bezel.png" id="bezel" class="noselect">
        <div id="content">
            
        </div>
    </div>
</body>

<script src="app.js"></script>
</html>
